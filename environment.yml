# Python environment for the pipeline's Python steps (00a, 01).
# Needs: scanpy/anndata (subset/relabel), gprofiler-official (orthology),
# and BRISC (h5ad -> Seurat .rds, which itself requires the `ryp` R bridge).
#
# NOTE: an existing `brisc` conda env already provides brisc + ryp + R at
#   /scratch/mfafouti/miniforge3/envs/brisc
# The simplest path is to reuse it and just add gprofiler-official + scanpy:
#   conda activate brisc
#   uv pip install gprofiler-official        # (ask before installing)
# This file documents a from-scratch build if you'd rather isolate it.
name: rna-fingerprinting
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy
  - anndata
  - pandas
  - numpy
  - pip
  - pip:
      - gprofiler-official>=1.0.0
      - brisc
      # brisc writes .rds via ryp; ryp needs an R install visible to this env.
