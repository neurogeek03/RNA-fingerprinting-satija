# RNA fingerprinting pipeline — single source of truth for paths & tunables.
# INI format: read by Python (configparser, utils/config.py) and R (utils/config.R).
# Blank keys are filled once the inputs land (see [perturbseq].h5ad).
#
# One FIXED mouse Perturb-seq dictionary; SWAPPABLE query cohorts (rat, human...).
# Each query is ortholog-mapped to mouse before fingerprinting.

[paths]
# Repo moves between clusters; everything below is derived from project_root.
project_root = /scratch/mfafouti/RNA-fingerprinting-satija
results_dir  = /scratch/mfafouti/RNA-fingerprinting-satija/results
# Reusable ortholog work to lean on (see utils/orthology.py and the rat->mouse table).
proton_orthologs   = /scratch/mfafouti/Mommybrain-PPD/PROTON/utils/orthologs.py
rat_mouse_table    = /scratch/mfafouti/Mommybrain/Slide_seq/RCTD/genes_mouse_rename/out/rat_to_mouse_filtered.csv

[perturbseq]
# The mouse Perturb-seq dictionary source (~7M cells). FILL once the file is staged.
h5ad                   =
# Metadata column in .obs holding the perturbed gene / guide target identity.
perturbation_col       = gene
# Control / non-targeting class label within perturbation_col.
control_class          = non-targeting
# Downsampling to make LearnDictionary tractable (00a, Python/scanpy):
cells_per_perturbation = 300
min_cells              = 10
# Feature selection for the dictionary (ChooseFeatures): 'de' or 'expression'.
feature_method         = de
# Reduced (post-subset) Seurat object written by BRISC, and the learned dictionary.
# BRISC: SingleCell(h5ad).save(reduced_rds, assay='RNA', X_key='counts') (Seurat v5).
reduced_rds            = /scratch/mfafouti/RNA-fingerprinting-satija/results/dictionary/perturbseq_reduced.rds
dictionary_rds         = /scratch/mfafouti/RNA-fingerprinting-satija/results/dictionary/own_dictionary.rds

[gwps]
# Precomputed genome-wide Perturb-seq dictionary (RNAFingerprintingData).
use                    = true
name                   = gwps
gene_key               = SYMBOL
dictionary_rds         = /scratch/mfafouti/RNA-fingerprinting-satija/results/dictionary/gwps_dictionary.rds

[orthology]
# Target = the dictionary species (mouse). Source varies per cohort (see [query.*]).
target_organism        = mmusculus
# Optional: pin a g:Profiler archive release for reproducibility, e.g.
#   https://biit.cs.ut.ee/gprofiler_archive3/e111_eg58_p18/
# Leave blank to use the current release (build date is recorded in the cache).
gprofiler_base_url     =
# Minimum mouse-orthology confidence (0/1) when reusing an object's own var map.
min_orthology_confidence = 1

# ---- Query cohorts. Add a [query.<name>] section per dataset. -----------------
[query.rat]
species          = rnorvegicus
# DE-input expression object (raw counts, used AS-IS; no extra QC/gene filter).
h5ad             = /scratch/mfafouti/Mommybrain-PPD/Slide_tags/EdgeR/data/DE_after_mt_filter_108123_mincells_10_in_2_samples_slide_tags.h5ad
# var index gene-id type and the symbol column to ortholog-map from.
gene_symbol_col  = gene_symbols
condition_col    = treatment
control_class    = OIL
celltype_col     = subclass_name
# edgeR DE results to join onto nominations (per-cell-type *_edgeR_results.tsv).
edger_dir        = /scratch/mfafouti/Mommybrain-PPD/Slide_tags/EdgeR/out/runs/lib_size_50k/edger_lrt/OIL_vs_CORT
ortholog_cache   = /scratch/mfafouti/RNA-fingerprinting-satija/results/query_rat/ortholog_rat_to_mouse.csv
# Query object relabeled to mouse symbols, written by BRISC as a Seurat .rds.
mapped_rds       = /scratch/mfafouti/RNA-fingerprinting-satija/results/query_rat/query_mouse_symbols.rds

[query.human]
species          = hsapiens
h5ad             =
gene_symbol_col  =
condition_col    =
control_class    =
celltype_col     =
edger_dir        =
ortholog_cache   = /scratch/mfafouti/RNA-fingerprinting-satija/results/query_human/ortholog_human_to_mouse.csv
mapped_rds       = /scratch/mfafouti/RNA-fingerprinting-satija/results/query_human/query_mouse_symbols.rds

[run]
# Which cohort to process in this run (name of a [query.<name>] section suffix).
cohort           = rat
# Fingerprinting granularity.
group_level      = true
mc_cores         = 5
# Skip cell types (subclasses) with fewer than this many cells.
min_cells_per_celltype = 50

[thresholds]
# DE significance for interpretation/joining (edgeR FDR).
fdr        = 0.05
logfc_min  = 0.0
